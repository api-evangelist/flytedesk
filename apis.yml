  note: >-
    Round 1 recorded "The company exposes no public developer API." That was wrong. STEP 0b
    contract discovery found the API base https://api.app.flytedesk.com in the app.flytedesk.com
    SPA bundle; POSTing a GraphQL introspection query to /api/graphql returns HTTP 200
    anonymously with the full 374-type schema. FlyteDesk also serves a real llms.txt at
    www.flytedesk.com/llms.txt and publishes three packaged Agent Skills in
    github.com/Flytedesk/flytedesk-skills. No OpenAPI, no MCP server, no agent card, no
    /.well-known/ document, no pricing page, no status page and no SDK for its own API.
