apis:
- name: FlyteDesk GraphQL API
  description: >-
    The first-party GraphQL API behind the flytedesk application — the campus advertising
    marketplace covering suppliers (campus media organizations), campuses, buyers,
    audiences, ad shops, campaigns, ads, orders, invoicing and finance tracking. It is not
    a documented developer API: FlyteDesk publishes no portal, no reference and no SDK,
    and credentials are issued by invitation through the product. It is captured here
    because introspection is enabled on the production endpoint, so the complete schema
    (374 types, 37 queries, 25 mutations) is publicly readable and machine-usable.
  humanURL: https://app.flytedesk.com/
  baseURL: https://api.app.flytedesk.com/api/graphql
