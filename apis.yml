aid: flytedesk
name: FlyteDesk
description: flytedesk is the campus advertising platform that connects national brands
  with college media across the United States. Founded in 2015 in Boulder, Colorado,
  it operates the largest network of campus media in the US, letting advertisers create,
  book, manage, and measure national campaigns across print, digital, email newsletters,
  social, influencer, radio, and out-of-home channels reaching millions of college
  students. For college publishers and campus media organizations, its self-serve
  platform provides tools to build, manage, and monetize their media ecosystem, along
  with an Audience Builder for targeting. flytedesk is backed by Techstars. The company
  exposes no public developer API; this profile tracks its public web presence and
  security posture for the API Evangelist network.
