source: https://github.com/orgs/Flytedesk/repositories + rubygems.org and registry.npmjs.org metadata endpoints
note: >-
  FlyteDesk publishes NO client library for its own API. Its GraphQL endpoint
  (https://api.app.flytedesk.com/api/graphql) has no SDK in any registry — npm, PyPI,
  RubyGems, Maven Central, NuGet, pkg.go.dev, Packagist and crates.io were all searched
  for "flytedesk" and returned nothing API-related. What the company does publish is a
  handful of general-purpose Ruby/JS engineering libraries out of its GitHub org; those
  are recorded below for completeness, flagged honestly, and are NOT SDKs. Because there
  is no first-party SDK for the FlyteDesk API, apis.yml carries a Packages pointer but
  deliberately does NOT carry an SDKs pointer.
sdk_for_flytedesk_api: false
