source: live error responses from https://api.app.flytedesk.com/api/graphql
note: >-
  FlyteDesk publishes no error reference, so this catalogue is built from error responses
  actually returned by the live GraphQL endpoint to an anonymous caller. Categories are the
  values the server itself puts in `errors[].extensions.category`. This is a partial
  catalogue by construction — only anonymously reachable failure modes could be observed.
format: graphql-errors
rfc9457: false
problem_json: false
envelope:
  http_status_on_error: 200
  shape: '{ "errors": [ { "message", "extensions": { "category" }, "locations", "path", "trace" } ], "extensions": {...} }'
  discriminator: extensions.category
  note: >-
    Errors are returned with HTTP 200 in the GraphQL style, so a client MUST inspect the
    body — status code alone never signals failure. Transport-level failures (404 on GET,
    for example) do use real status codes.
error_count: 2
errors:
